apiVersion: v1
kind: Namespace
metadata:
  name: pod-rightsizing
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: boosted-app-vpa
  namespace: pod-rightsizing
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: boosted-app
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  startupBoost:
    cpu:
      type: "Factor"
      factor: 4
      durationSeconds: 0
  resourcePolicy:
    containerPolicies:
      - containerName: app
        controlledValues: RequestsAndLimits
        minAllowed:
          cpu: 250m
          memory: 128Mi
        maxAllowed:
          cpu: 2000m
          memory: 256Mi
